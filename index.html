    // --- LIVE TIMER COMPONENT ---
    function LiveTimer({ startedAt }) {
      const [elapsed, setElapsed] = useState(0);

      useEffect(() => {
        const startMs = new Date(startedAt).getTime();
        const update = () => setElapsed(Math.max(0, Math.floor((Date.now() - startMs) / 1000)));
        update();
        const interval = setInterval(update, 1000);
        return () => clearInterval(interval);
      }, [startedAt]);

      const pad = (n) => n.toString().padStart(2, '0');
      const hrs = Math.floor(elapsed / 3600);
      const mins = Math.floor((elapsed % 3600) / 60);
      const secs = elapsed % 60;

      return (
        <span className="inline-flex items-center gap-1.5 font-mono text-xs font-bold text-emerald-700 bg-emerald-100/90 px-2.5 py-1 rounded-lg border border-emerald-300">
          <span className="w-2 h-2 rounded-full bg-emerald-500 animate-ping" />
          <span>Active: {hrs > 0 ? `${pad(hrs)}:` : ''}{pad(mins)}:{pad(secs)}</span>
        </span>
      );
    }

        try {
          const s = localStorage.getItem(SK.ACCOUNTS);
          if (s) {
            const p = JSON.parse(s);
            if (Array.isArray(p) && p.length > 0) return p;
          }

        return INITIAL_USERS;

        return 'user-aadit-thapa';

      }, [accounts, currentUserId]);

      const [appointments, setAppointments] = useState(() => {

            if (Array.isArray(p)) return p;
          }

      // Save to localStorage

        try { localStorage.setItem(SK.ACCOUNTS, JSON.stringify(accounts)); } catch (e) {}

      useEffect(() => {
        try { localStorage.setItem(SK.APTS, JSON.stringify(appointments)); } catch (e) {}

          if (currentUserId) localStorage.setItem(SK.CURRENT_USER, currentUserId);
          else localStorage.removeItem(SK.CURRENT_USER);
        } catch (e) {}
      }, [currentUserId]);

      const notify = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(null), 4000);
      };

      const handleToggleMode = () => {
        if (!currentUser) {
          setActiveView('portal');
          return;
        }
        const nextMode = currentUser.currentMode === 'tutor' ? 'learner' : 'tutor';
        const updated = accounts.map((a) => {
          if (a.id === currentUser.id) {
            return {
              ...a,
              currentMode: nextMode,
              isTutorRegistered: nextMode === 'tutor' ? true : a.isTutorRegistered,
              tutorProfile: nextMode === 'tutor' && !a.tutorProfile ? {
                subjects: [{ subjectId: 'math-aa', subjectName: 'Mathematics: Analysis and Approaches', groupName: 'Mathematics', level: 'HL', gradeScore: 7, scoreBadge: 'Grade 7' }],

              } : a.tutorProfile

        });
        setAccounts(updated);
        notify(`Switched to ${nextMode === 'tutor' ? 'Tutor' : 'Learner'} Mode`);
        setActiveView(nextMode === 'tutor' ? 'tutor-station' : 'browse');
      };

      // Appointment Actions
      const handleConfirmApt = (id) => {
        setAppointments((prev) => prev.map((a) => a.id === id ? { ...a, status: 'confirmed' } : a));
        notify('Session confirmed!');
      };

      const handleStartSession = (id) => {
        setAppointments((prev) => prev.map((a) => a.id === id ? { ...a, status: 'in_progress', startedAt: new Date().toISOString() } : a));
        notify('Session timer started!');
      };

      const handleEndSession = (id) => {
        const apt = appointments.find((a) => a.id === id);
        if (!apt) return;
        const startMs = apt.startedAt ? new Date(apt.startedAt).getTime() : Date.now();
        const durationSeconds = Math.max(1, Math.floor((Date.now() - startMs) / 1000));
        setAppointments((prev) => prev.map((a) => a.id === id ? { ...a, status: 'completed', durationSeconds, endedAt: new Date().toISOString() } : a));
        notify(`Session ended! Recorded ${Math.floor(durationSeconds / 60)}m ${durationSeconds % 60}s`);
      };

      const handleRemoveApt = (id) => {
        setAppointments((prev) => prev.filter((a) => a.id !== id));
        notify('Appointment removed.');
      };

      const registeredTutors = useMemo(() => {
        return accounts.filter((u) => u && u.isTutorRegistered && u.tutorProfile && u.tutorProfile.subjects && u.tutorProfile.subjects.length > 0);
      }, [accounts]);

      const filteredTutors = useMemo(() => {
        return registeredTutors.filter((tutor) => {
          const profile = tutor.tutorProfile;
          if (selectedBlocks.length > 0) {
            const hasMutual = profile.availableBlocks?.some((b) => selectedBlocks.includes(b));
            if (!hasMutual) return false;
          }
          if (selectedGroup !== 'All Groups') {
            const match = profile.subjects.some((s) => s.groupName === selectedGroup || selectedGroup.includes(s.groupName));
            if (!match) return false;
          }
          if (selectedLevel !== 'ALL') {
            const match = profile.subjects.some((s) => s.level === selectedLevel);
            if (!match) return false;
          }
          if (searchQuery.trim()) {
            const q = searchQuery.toLowerCase();
            const nameMatch = String(tutor.name || '').toLowerCase().includes(q);
            const notesMatch = String(profile.notes || '').toLowerCase().includes(q);
            const subMatch = profile.subjects.some((s) => String(s.subjectName || '').toLowerCase().includes(q));
            if (!nameMatch && !notesMatch && !subMatch) return false;
          }
          return true;
        });
      }, [registeredTutors, selectedBlocks, selectedGroup, selectedLevel, searchQuery]);

                </div>

                {/* 3. TUTOR CARDS GRID */}
                {filteredTutors.length === 0 ? (
                  <div className="bg-white rounded-3xl border border-slate-200 p-12 text-center space-y-3">
                    <ClockIcon className="w-10 h-10 text-slate-300 mx-auto" />
                    <h3 className="text-base font-bold text-slate-800">No tutors match your selected free blocks and search</h3>
                    <p className="text-xs text-slate-500 max-w-sm mx-auto">Try clearing your free blocks or resetting your search to see all peer tutors.</p>
                    <button onClick={() => { setSelectedBlocks([]); setSearchQuery(''); setSelectedGroup('All Groups'); setSelectedLevel('ALL'); }} className="px-4 py-2 bg-slate-900 text-white rounded-xl text-xs font-semibold cursor-pointer">Clear filters</button>
                  </div>
                ) : (
                  <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                    {filteredTutors.map((tutor) => {
                      const profile = tutor.tutorProfile;
                      const mutual = profile.availableBlocks?.filter((b) => selectedBlocks.includes(b)) || [];
                      return (
                        <div key={tutor.id} className="bg-white rounded-2xl border border-slate-200 p-6 flex flex-col justify-between shadow-xs hover:shadow-md transition-all">
                          <div className="space-y-4">
                            <div className="flex justify-between items-start gap-2">
                              <div>
                                <h3 className="text-lg font-bold text-slate-900">{tutor.name}</h3>
                                <span className="text-xs font-semibold px-2 py-0.5 rounded bg-slate-100 text-slate-700">{tutor.gradYear}</span>
                                <span className="text-xs text-slate-400 block mt-0.5">{tutor.email}</span>
                              </div>
                              <span className="text-xs font-bold text-emerald-800 bg-emerald-50 border border-emerald-200 px-2 py-1 rounded-lg">IB Tutor</span>
                            </div>

                            <div>
                              <span className="text-xs font-bold uppercase text-slate-400 block mb-1.5">Subjects Offered:</span>
                              <div className="space-y-1.5">
                                {profile.subjects?.map((sub, i) => (
                                  <div key={i} className="flex justify-between items-center text-xs p-2 rounded-lg bg-slate-50 border border-slate-100">
                                    <div className="flex items-center gap-1.5">
                                      <span className={`px-1.5 py-0.5 rounded text-[10px] font-bold ${sub.level === 'HL' ? 'bg-indigo-100 text-indigo-800' : 'bg-emerald-100 text-emerald-800'}`}>{sub.level}</span>
                                      <span className="font-semibold text-slate-800">{sub.subjectName}</span>
                                    </div>
                                    <span className="text-slate-500 font-medium text-[11px]">{sub.scoreBadge || `Grade ${sub.gradeScore || 7}`}</span>
                                  </div>
                                ))}
                              </div>
                            </div>

                            {profile.notes && (
                              <p className="text-xs text-slate-600 bg-amber-50/50 p-2.5 rounded-lg border border-amber-100 leading-relaxed italic">"{profile.notes}"</p>
                            )}

                            <div>
                              <div className="flex justify-between text-xs font-bold text-slate-400 uppercase mb-1.5">
                                <span>Free Blocks</span>
                                {mutual.length > 0 && <span className="text-emerald-700 normal-case">{mutual.length} match your timetable</span>}
                              </div>
                              <div className="flex flex-wrap gap-1">
                                {profile.availableBlocks?.map((bId) => {
                                  const b = FREE_BLOCKS.find((x) => x.id === bId);
                                  if (!b) return null;
                                  const isM = selectedBlocks.includes(bId);
                                  return (
                                    <span key={bId} className={`px-2 py-0.5 rounded text-[11px] font-semibold ${b.bgClass} ${b.textClass} ${isM ? 'ring-2 ring-emerald-500' : 'opacity-90'}`}>
                                      {b.name}
                                    </span>
                                  );
                                })}
                              </div>
                            </div>
                          </div>

                          <div className="pt-4 border-t border-slate-100 mt-4">
                            <button
                              onClick={() => setScheduleModalTutor(tutor)}
                              className="w-full py-2.5 rounded-xl bg-slate-900 hover:bg-slate-800 text-white font-bold text-xs flex items-center justify-center gap-2 cursor-pointer shadow-xs"
                            >
                              <CalendarIcon className="w-4 h-4" />
                              <span>Schedule Appointment</span>
                              <ArrowRightIcon className="w-3.5 h-3.5 ml-auto" />
                            </button>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
            )}
          </main>

          {/* DISCREET ADMIN LINK IN BOTTOM FOOTER */}
          <footer className="border-t border-slate-200 bg-white py-8 mt-16 text-xs text-slate-500">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 flex flex-col sm:flex-row items-center justify-between gap-4">
              <div className="flex items-center gap-2">
                <span className="font-bold text-slate-800">Ullens IBDP Peer Tutoring Network</span>
                <span>·</span>
                <span>Class of 2027 (IBDP Y-2) & Class of 2028 (IBDP Y-1)</span>
              </div>
              <div className="flex items-center gap-4">
                <button onClick={() => setActiveView('syllabus')} className="hover:text-slate-800 cursor-pointer">Subject Offerings</button>
                <span>·</span>
                <button onClick={() => setActiveView('portal')} className="hover:text-slate-800 cursor-pointer">Student Portal</button>
                <span>·</span>
                <button onClick={() => setActiveView('admin')} className="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg border border-slate-200 text-slate-500 hover:text-slate-800 hover:bg-slate-50 cursor-pointer text-[11px]">
                  <ActivityIcon className="w-3.5 h-3.5 text-slate-400" />
                  <span>Admin Portal</span>
                </button>
              </div>
            </div>
          </footer>

          {/* SCHEDULE MODAL */}
          {scheduleModalTutor && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-xs">
              <div className="bg-white rounded-3xl border border-slate-200 shadow-2xl max-w-lg w-full p-6 space-y-4 animate-in fade-in zoom-in-95">
                <div className="flex justify-between items-start border-b border-slate-100 pb-3">
                  <div>
                    <h3 className="text-base font-bold text-slate-900">Schedule Tutoring Session</h3>
                    <p className="text-xs text-slate-500">with {scheduleModalTutor.name} ({scheduleModalTutor.gradYear})</p>
                  </div>
                  <button onClick={() => setScheduleModalTutor(null)} className="text-slate-400 hover:text-slate-700 cursor-pointer"><XIcon className="w-5 h-5" /></button>
                </div>

                <form onSubmit={(e) => {
                  e.preventDefault();
                  const form = e.target;
                  const newApt = {
                    id: `apt-${Date.now().toString().slice(-6)}`,
                    tutorId: scheduleModalTutor.id,
                    tutorName: scheduleModalTutor.name,
                    tutorEmail: scheduleModalTutor.email,
                    learnerId: currentUser?.id || `guest-${Date.now()}`,
                    learnerName: form.learnerName.value.trim() || 'Learner Student',
                    learnerEmail: form.learnerEmail.value.trim() || 'student@ullens.edu.np',
                    subjectId: form.subject.value,
                    subjectName: form.subject.options[form.subject.selectedIndex].text,
                    level: 'HL',
                    blockId: form.block.value,
                    blockName: form.block.options[form.block.selectedIndex].text,
                    date: form.date.value,
                    notes: form.notes.value.trim(),
                    status: 'pending',
                    createdAt: new Date().toISOString()
                  };
                  setAppointments((prev) => [newApt, ...prev]);
                  notify(`Booking request sent to ${scheduleModalTutor.name}!`);
                  setScheduleModalTutor(null);
                  setActiveView('appointments');
                }} className="space-y-3.5 text-xs">
                  <div>
                    <label className="block font-bold text-slate-700 mb-1">Subject</label>
                    <select name="subject" className="w-full p-2.5 rounded-xl border border-slate-200 bg-white">
                      {scheduleModalTutor.tutorProfile?.subjects?.map((s) => (
                        <option key={s.subjectId} value={s.subjectId}>{s.subjectName} ({s.level})</option>
                      ))}
                    </select>
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">Free Block</label>
                      <select name="block" className="w-full p-2.5 rounded-xl border border-slate-200 bg-white">
                        {scheduleModalTutor.tutorProfile?.availableBlocks?.map((bId) => {
                          const b = FREE_BLOCKS.find((x) => x.id === bId);
                          return b ? <option key={b.id} value={b.id}>{b.name}</option> : null;
                        })}
                      </select>
                    </div>
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">Date</label>
                      <input name="date" type="date" required defaultValue={new Date(Date.now() + 86400000).toISOString().split('T')[0]} className="w-full p-2.5 rounded-xl border border-slate-200" />
                    </div>
                  </div>

                  <div>
                    <label className="block font-bold text-slate-700 mb-1">Your Name</label>
                    <input name="learnerName" type="text" required defaultValue={currentUser?.name || ''} placeholder="Your Full Name" className="w-full p-2.5 rounded-xl border border-slate-200" />
                  </div>

                  <div>
                    <label className="block font-bold text-slate-700 mb-1">Your Ullens Email</label>
                    <input name="learnerEmail" type="email" required defaultValue={currentUser?.email || ''} placeholder="student@ullens.edu.np" className="w-full p-2.5 rounded-xl border border-slate-200" />
                  </div>

                  <div>
                    <label className="block font-bold text-slate-700 mb-1">Topics / Help Request</label>
                    <textarea name="notes" placeholder="e.g. Need help with calculus past paper questions..." rows={2} className="w-full p-2.5 rounded-xl border border-slate-200" />
                  </div>

                  <div className="flex gap-2 pt-2">
                    <button type="button" onClick={() => setScheduleModalTutor(null)} className="flex-1 py-2.5 rounded-xl border border-slate-200 font-bold text-slate-700 hover:bg-slate-50 cursor-pointer">Cancel</button>
                    <button type="submit" className="flex-1 py-2.5 rounded-xl bg-slate-900 text-white font-bold hover:bg-slate-800 cursor-pointer">Submit Booking</button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
